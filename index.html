<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מעגל">
<meta name="theme-color" content="#2A1D38">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>מעגל — מעקב מחזור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0; --surface:#FFFFFF; --ink:#3D405B; --muted:#7A7D99; --line:#E8E0D6;
  --primary:#A8D5BA; --primary-dark:#6FB38C; --secondary:#FFD6A5; --accent:#BDB2FF;
  --period:#FFADAD; --period-soft:#FFE3E3; --ov:#BDB2FF; --fertile:#A8D5BA; --today:#3D405B; --focus:#6FB38C;
  color-scheme: light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
h1,h2{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;margin:0;line-height:1.15}
h2{font-size:1.45rem;font-weight:700;margin-bottom:14px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;margin-bottom:34px}
@media (min-width:640px){.hero{grid-template-columns:300px minmax(0,1fr);gap:34px}}
.dial{width:100%;max-width:300px;margin:0 auto;display:block}
.dial text{font-family:Calibri,Carlito,sans-serif;fill:var(--ink)}
.hero h1{font-size:clamp(2.1rem,7vw,3rem);font-weight:900;margin-bottom:10px}
.hero .lead{font-size:1.12rem;margin:0 0 14px}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:10px;align-items:baseline}
.dot{width:11px;height:11px;border-radius:50%;flex:none;transform:translateY(1px)}
.dot.p{background:var(--period)} .dot.o{background:var(--ov)} .dot.f{background:var(--fertile);border:1px solid var(--ov)}
.facts b{font-weight:700}
.sub{color:var(--muted);font-size:.95rem}

section{margin-bottom:38px}
.log{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.fields{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.fields > div{min-width:0}
@media (min-width:560px){.fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
label{display:block;font-weight:600;font-size:.95rem;margin-bottom:5px}
label small{font-weight:400;color:var(--muted)}
input[type=date]{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;font-size:16px;line-height:1.3;direction:ltr;text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);min-height:48px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;min-height:46px}
.btn.primary{background:var(--primary);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.msg{font-size:.95rem;min-height:1.4em;margin:10px 0 0}
.msg.err{color:var(--ink);background:var(--period-soft);border-radius:8px;padding:6px 10px}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head h2{margin:0}
.nav{display:flex;gap:6px}
.nav button{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:.85rem;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.98rem;position:relative}
.day.out{visibility:hidden}
.day.period{background:var(--period);color:var(--ink);font-weight:700}
.day.pred-period{background:repeating-linear-gradient(135deg,var(--period-soft) 0 5px,transparent 5px 9px);border:1.5px dashed var(--period)}
.day.fertile{background:var(--fertile)}
.day.ov{background:var(--ov);color:var(--ink);font-weight:700}
.day.pred-ov{box-shadow:inset 0 0 0 2.5px var(--ov);font-weight:700}
.day.today::after{content:"";position:absolute;bottom:9%;width:5px;height:5px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:.9rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:16px;height:16px;border-radius:50%;display:inline-block}

.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.hist .when{font-weight:700}
.hist .meta{color:var(--muted);font-size:.92rem}
.hist .ops{display:flex;gap:4px;flex:none}
.hist button{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted)}
.note{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
.sync{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;transition:opacity .3s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:min(45vmin,320px);height:auto}
.splash-name{font-size:1.6rem;font-weight:700;color:var(--ink)}
.fronds{transform-box:view-box;transform-origin:112px 84px;animation:sway 2.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.fronds{animation:none}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="טוען">
  <svg class="splash-logo" viewBox="0 0 200 200" aria-hidden="true">
    <ellipse cx="100" cy="186" rx="72" ry="10" fill="#FFD6A5"/>
    <path d="M96 186 Q104 130 112 84" fill="none" stroke="#D4A373" stroke-width="10" stroke-linecap="round"/>
    <g class="fronds" fill="#6FB38C">
      <path d="M112 84 Q80 56 36 66 Q72 72 112 84Z"/>
      <path d="M112 84 Q144 50 182 62 Q150 68 112 84Z"/>
      <path d="M112 84 Q94 44 66 30 Q92 42 112 84Z"/>
      <path d="M112 84 Q130 40 156 28 Q134 44 112 84Z"/>
      <path d="M112 84 Q120 108 160 118 Q128 110 112 84Z"/>
    </g>
  </svg>
  <div class="splash-name">מעגל</div>
</div>
<main>
  <div class="hero">
    <svg class="dial" id="dial" viewBox="0 0 300 300" role="img" aria-label="מצב במחזור"></svg>
    <div>
      <h1 id="title">מעגל</h1>
      <p class="lead" id="lead">הכניסי את המחזור האחרון כדי להתחיל.</p>
      <ul class="facts" id="facts"></ul>
    </div>
  </div>

  <section class="log" aria-labelledby="logTitle">
    <h2 id="logTitle">תיעוד מחזור</h2>
    <div class="fields">
      <div><label for="fStart">התחלת מחזור</label><input type="date" id="fStart" required></div>
      <div><label for="fEnd">סוף מחזור <small>(לא חובה)</small></label><input type="date" id="fEnd"></div>
      <div><label for="fOv">ביוץ <small>(לא חובה)</small></label><input type="date" id="fOv"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="save">שמירה</button>
      <button class="btn ghost" id="cancel" hidden>ביטול עריכה</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section aria-labelledby="calTitle">
    <div class="cal-head">
      <h2 id="calTitle"></h2>
      <div class="nav">
        <button id="prev">חודש קודם</button>
        <button id="next">חודש הבא</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--period)"></i>מחזור</span>
      <span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--period-soft) 0 4px,transparent 4px 7px);border:1.5px dashed var(--period)"></i>מחזור צפוי</span>
      <span><i class="sw" style="background:var(--ov)"></i>ביוץ</span>
      <span><i class="sw" style="box-shadow:inset 0 0 0 2.5px var(--ov)"></i>ביוץ צפוי</span>
      <span><i class="sw" style="background:var(--fertile)"></i>חלון פוריות</span>
    </div>
  </section>

  <section aria-labelledby="histTitle">
    <h2 id="histTitle">היסטוריה</h2>
    <ul class="hist" id="hist"></ul>
  </section>

  <p class="note">התחזית מבוססת על הממוצעים של המחזורים שתיעדת, והיא נעשית מדויקת יותר עם כל חודש. היא לא מתאימה כאמצעי מניעה.
    <span class="sync" id="sync"></span></p>
</main>

<script>
(function(){
  const DAY = 86400000;
  const LS_KEY = 'cycle-tracker-entries-v1';
  let entries = [];
  let editingId = null;
  let viewMonth = startOfMonth(new Date());
  let writeChain = Promise.resolve();

  function toKey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
  function fromKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
  function utc(k){ const [y,m,d]=k.split('-').map(Number); return Date.UTC(y,m-1,d); }
  function diff(a,b){ return Math.round((utc(b)-utc(a))/DAY); }
  function addDays(k,n){ const d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); }
  function todayKey(){ return toKey(new Date()); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  const fmtDay = new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long'});
  const fmtDayW = new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'});
  const fmtFull = new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric'});
  const fmtMonth = new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'});
  const f = (k,fmt=fmtDay) => fmt.format(fromKey(k));
  function days(n){ return n===1 ? 'יום אחד' : n===2 ? 'יומיים' : n+' ימים'; }

  // ---------- storage: server is the source of truth, localStorage is a cache ----------
  function loadLocal(){ try{ const v=localStorage.getItem(LS_KEY); return v?JSON.parse(v):[]; }catch(e){ return []; } }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }catch(e){} }
  function setSync(t){ document.getElementById('sync').textContent = t; }

  function persist(){
    saveLocal();
    const snapshot = entries.map(e=>({...e}));
    writeChain = writeChain
      .then(()=>fetch('/api/cycles',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({entries:snapshot})}))
      .then(r=>{ if(!r.ok) throw new Error('save'); setSync('נשמר באתר.'); })
      .catch(()=>setSync('השמירה לשרת נכשלה. הנתונים נשמרו בדפדפן הזה בלבד. נסי שוב בעוד רגע.'));
  }

  async function loadRemote(){
    try{
      const r = await fetch('/api/cycles',{cache:'no-store'});
      if(!r.ok) throw new Error('load');
      const data = await r.json();
      if(Array.isArray(data.entries) && data.entries.length){
        entries = data.entries.map(e=>({...e}));
        saveLocal(); render(); setSync('הנתונים נטענו מהשרת.');
      } else if(entries.length){
        persist(); // first sync: push what this browser already has
      } else {
        setSync('הנתונים יישמרו באתר ויהיו זמינים מכל מכשיר.');
      }
    }catch(e){
      setSync('לא הצלחתי להתחבר לשרת. מוצגים הנתונים שבדפדפן הזה.');
    }
  }

  // ---------- model ----------
  function sorted(){ return [...entries].sort((a,b)=>a.start<b.start?-1:1); }
  function mean(a){ return a.reduce((s,x)=>s+x,0)/a.length; }
  function sd(a){ if(a.length<2) return 0; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); }
  function wmean(a){ let s=0,w=0; a.forEach((x,i)=>{ const wt=i+1; s+=x*wt; w+=wt; }); return s/w; }

  function model(){
    const list = sorted();
    const cycleLens=[], periodLens=[], luteals=[];
    for(let i=0;i<list.length;i++){
      const e=list[i], n=list[i+1];
      if(e.end){ const p=diff(e.start,e.end)+1; if(p>=1&&p<=14) periodLens.push(p); }
      if(n){
        const c=diff(e.start,n.start);
        if(c>=18&&c<=60) cycleLens.push(c);
        if(e.ov){ const l=diff(e.ov,n.start); if(l>=7&&l<=20) luteals.push(l); }
      }
    }
    const recent = cycleLens.slice(-8);
    const cycle = recent.length ? Math.round(wmean(recent)) : 28;
    const period = periodLens.length ? Math.round(mean(periodLens.slice(-8))) : 5;
    const luteal = luteals.length ? Math.round(mean(luteals.slice(-8))) : 14;
    const ovOffsets = list.filter(e=>e.ov).map(e=>diff(e.start,e.ov)).filter(x=>x>=6&&x<=40);
    let ovDay = cycle - luteal;
    if(!luteals.length && ovOffsets.length) ovDay = Math.round(mean(ovOffsets.slice(-8)));
    ovDay = Math.max(6, Math.min(cycle-7, ovDay));
    return {list, cycle, period, ovDay, spread: Math.round(sd(recent)), nCycles: cycleLens.length,
            learnedOv: luteals.length>0 || ovOffsets.length>0};
  }

  function predictions(m, count=4){
    const last = m.list[m.list.length-1];
    if(!last) return [];
    const out=[];
    for(let i=0;i<count;i++){
      const s = addDays(last.start, m.cycle*(i+1));
      const ov = addDays(s, -(m.cycle - m.ovDay));
      out.push({start:s, end:addDays(s,m.period-1), ov, fStart:addDays(ov,-5), fEnd:addDays(ov,1)});
    }
    return out;
  }

  function render(){
    const m = model();
    renderHero(m);
    renderCalendar(m);
    renderHistory(m);
  }

  function polar(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function arc(cx,cy,r,a0,a1){
    const [x0,y0]=polar(cx,cy,r,a0), [x1,y1]=polar(cx,cy,r,a1);
    const large = (a1-a0)>180?1:0;
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  }

  function renderHero(m){
    const dial=document.getElementById('dial'), lead=document.getElementById('lead'), facts=document.getElementById('facts');
    const last = m.list[m.list.length-1];
    const L = m.cycle, cx=150, cy=150, r=118;
    const deg = d => (d/L)*360;
    let svg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="22"/>`;
    for(let d=0; d<L; d++){
      const [x0,y0]=polar(cx,cy,r+15,deg(d)), [x1,y1]=polar(cx,cy,r+19,deg(d));
      svg += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>`;
    }
    svg += `<path d="${arc(cx,cy,r,deg(0)+0.8,deg(m.period)-0.8)}" fill="none" stroke="var(--period)" stroke-width="22"/>`;
    svg += `<path d="${arc(cx,cy,r,deg(m.ovDay-5)+0.8,deg(m.ovDay+2)-0.8)}" fill="none" stroke="var(--fertile)" stroke-width="22"/>`;
    const [ox,oy]=polar(cx,cy,r,deg(m.ovDay+0.5));
    svg += `<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="9" fill="var(--ov)"/>`;

    facts.innerHTML='';
    if(!last){
      svg += `<text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="30" font-weight="700">?</text>`;
      dial.innerHTML = svg;
      lead.textContent = 'הכניסי את תאריך התחלת המחזור האחרון כדי להתחיל. אחרי שניים-שלושה חודשים התחזית תהיה מותאמת לך.';
      return;
    }
    const t = todayKey();
    const dayIdx = diff(last.start, t);
    const preds = predictions(m);
    const next = preds[0];
    const late = dayIdx >= L;
    if(dayIdx>=0){
      const pos = Math.min(dayIdx, L-0.01);
      const [tx,ty]=polar(cx,cy,r,deg(pos+0.5));
      const [tx2,ty2]=polar(cx,cy,r-30,deg(pos+0.5));
      svg += `<line x1="${tx2.toFixed(1)}" y1="${ty2.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--today)" stroke-width="3" stroke-linecap="round"/>`;
      svg += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="13" fill="var(--surface)" stroke="var(--today)" stroke-width="3"/>`;
      svg += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="62" font-weight="900">${dayIdx+1}</text>`;
      svg += `<text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="17" style="fill:var(--muted);font-family:Calibri,Carlito,sans-serif">יום במחזור</text>`;
    } else {
      svg += `<text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="22">בקרוב</text>`;
    }
    dial.innerHTML = svg;

    const toNext = diff(t, next.start);
    const toOv = diff(t, next.ov);
    if(late){
      lead.textContent = `המחזור באיחור של ${days(dayIdx-L+1)} לעומת הממוצע שלך. כשהוא יתחיל, הכניסי את התאריך.`;
    } else if(dayIdx < m.period){
      lead.textContent = `את בימי המחזור. הוא צפוי להסתיים בסביבות ${f(addDays(last.start,m.period-1))}.`;
    } else if(t>=next.fStart && t<=next.fEnd){
      lead.textContent = toOv===0 ? 'היום הוא יום הביוץ הצפוי.' : `את בחלון הפוריות. הביוץ ${toOv>0?'צפוי בעוד '+days(toOv):'היה לפני '+days(-toOv)}.`;
    } else {
      lead.textContent = `המחזור הבא צפוי בעוד ${days(toNext)}.`;
    }

    const spread = m.spread>0 ? `<span class="sub"> (±${days(m.spread)})</span>` : '';
    const ovP = toOv<-1 ? preds[1] : next;
    facts.innerHTML = `
      <li><i class="dot p"></i><span>מחזור הבא: <b>${f(next.start,fmtDayW)}</b>${spread}</span></li>
      <li><i class="dot o"></i><span>ביוץ הבא: <b>${f(ovP.ov, fmtDayW)}</b></span></li>
      <li><i class="dot f"></i><span>חלון פוריות: <b>${f(ovP.fStart)} – ${f(ovP.fEnd)}</b></span></li>
      <li class="sub">${m.nCycles ? `אורך מחזור ממוצע ${m.cycle} ימים, מתוך ${m.nCycles} ${m.nCycles===1?'מחזור':'מחזורים'}.` : 'עדיין משתמשים בממוצע כללי של 28 ימים. עוד חודש של תיעוד וזה יתחיל להתאים לך.'}${m.learnedOv ? '' : ' הביוץ משוער לפי ממוצע כללי עד שתתעדי ביוץ.'}</li>`;
  }

  function renderCalendar(m){
    const grid=document.getElementById('grid');
    document.getElementById('calTitle').textContent = fmtMonth.format(viewMonth);
    const marks = {};
    const add=(k,c)=>{ (marks[k]=marks[k]||new Set()).add(c); };
    const t=todayKey();
    m.list.forEach((e,i)=>{
      const isLast = i===m.list.length-1;
      const end = e.end || (isLast && diff(e.start,t) < m.period ? t : addDays(e.start,m.period-1));
      for(let k=e.start; k<=end; k=addDays(k,1)) add(k,'period');
      if(e.ov) add(e.ov,'ov');
    });
    const last = m.list[m.list.length-1];
    predictions(m,6).forEach(p=>{
      for(let k=p.fStart;k<=p.fEnd;k=addDays(k,1)) if(k>=t) add(k,'fertile');
      if(p.ov>=t) add(p.ov,'pred-ov');
      for(let k=p.start;k<=p.end;k=addDays(k,1)) if(k>=t) add(k,'pred-period');
    });
    if(last && !last.ov){
      const ov=addDays(last.start,m.ovDay);
      for(let k=addDays(ov,-5);k<=addDays(ov,1);k=addDays(k,1)) if(k>=t) add(k,'fertile');
      if(ov>=t) add(ov,'pred-ov');
    }
    let html = ['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div class="wd">${d}</div>`).join('');
    const first = viewMonth.getDay();
    for(let i=0;i<first;i++) html+=`<div class="day out"></div>`;
    const dim = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0).getDate();
    const names = {period:'מחזור','pred-period':'מחזור צפוי',fertile:'חלון פוריות',ov:'ביוץ','pred-ov':'ביוץ צפוי'};
    for(let d=1; d<=dim; d++){
      const k = toKey(new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d));
      const s = marks[k] || new Set();
      let cls = 'day';
      if(s.has('period')) cls+=' period';
      else if(s.has('pred-period')) cls+=' pred-period';
      else if(s.has('fertile')) cls+=' fertile';
      if(s.has('ov')) cls+=' ov'; else if(s.has('pred-ov') && !s.has('period')) cls+=' pred-ov';
      if(k===t) cls+=' today';
      const label = [...s].map(x=>names[x]).join(', ');
      html += `<div class="${cls}" aria-label="${d}${label?' – '+label:''}${k===t?' – היום':''}">${d}</div>`;
    }
    grid.innerHTML = html;
  }

  function renderHistory(m){
    const ul=document.getElementById('hist');
    const list=[...m.list].reverse();
    if(!list.length){ ul.innerHTML='<li class="empty">עוד אין מחזורים מתועדים.</li>'; return; }
    ul.innerHTML = list.map(e=>{
      const idx = m.list.indexOf(e), next = m.list[idx+1];
      const parts=[];
      if(e.end) parts.push(`עד ${f(e.end)} (${days(diff(e.start,e.end)+1)})`);
      if(e.ov) parts.push(`ביוץ ${f(e.ov)}`);
      if(next) parts.push(`אורך מחזור ${diff(e.start,next.start)} ימים`);
      return `<li><div><div class="when">${f(e.start,fmtFull)}</div><div class="meta">${parts.join('. ') || 'נרשם רק תאריך התחלה'}</div></div>
        <div class="ops"><button data-edit="${e.id}">עריכה</button><button data-del="${e.id}">מחיקה</button></div></li>`;
    }).join('');
  }

  const fStart=document.getElementById('fStart'), fEnd=document.getElementById('fEnd'), fOv=document.getElementById('fOv');
  const msg=document.getElementById('msg'), cancelBtn=document.getElementById('cancel'), saveBtn=document.getElementById('save');
  function say(t,err){ msg.textContent=t; msg.className='msg'+(err?' err':''); }
  function resetForm(){ editingId=null; fStart.value=''; fEnd.value=''; fOv.value=''; cancelBtn.hidden=true; saveBtn.textContent='שמירה'; }

  saveBtn.addEventListener('click',()=>{
    const s=fStart.value, e=fEnd.value, o=fOv.value;
    if(!s){ say('צריך תאריך התחלה כדי לשמור.',true); fStart.focus(); return; }
    if(e && e<s){ say('תאריך הסוף לא יכול להיות לפני תאריך ההתחלה.',true); return; }
    if(e && diff(s,e)>14){ say('המחזור ארוך מ-15 ימים. בדקי את תאריך הסוף.',true); return; }
    if(o && (o<s || diff(s,o)>50)){ say('תאריך הביוץ צריך להיות אחרי התחלת המחזור הזה.',true); return; }
    if(entries.some(x=>x.start===s && x.id!==editingId)){ say('כבר יש מחזור שמתחיל בתאריך הזה. אפשר לערוך אותו מההיסטוריה.',true); return; }
    if(editingId){
      const x=entries.find(x=>x.id===editingId); Object.assign(x,{start:s,end:e||null,ov:o||null});
      say('המחזור עודכן.');
    } else {
      entries.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), start:s, end:e||null, ov:o||null});
      say('המחזור נשמר.');
    }
    resetForm(); persist(); render();
  });
  cancelBtn.addEventListener('click',()=>{ resetForm(); say(''); });

  document.getElementById('hist').addEventListener('click',ev=>{
    const ed=ev.target.closest('[data-edit]'), de=ev.target.closest('[data-del]');
    if(ed){
      const x=entries.find(x=>x.id===ed.dataset.edit); if(!x) return;
      editingId=x.id; fStart.value=x.start; fEnd.value=x.end||''; fOv.value=x.ov||'';
      cancelBtn.hidden=false; saveBtn.textContent='עדכון'; say('');
      document.getElementById('logTitle').scrollIntoView({behavior:'smooth',block:'start'}); fStart.focus({preventScroll:true});
    }
    if(de){
      const x=entries.find(x=>x.id===de.dataset.del); if(!x) return;
      if(!confirm('למחוק את המחזור מ-'+f(x.start,fmtFull)+'?')) return;
      entries=entries.filter(y=>y.id!==x.id); if(editingId===x.id) resetForm();
      persist(); render(); say('המחזור נמחק.');
    }
  });

  document.getElementById('prev').addEventListener('click',()=>{ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1); render(); });
  document.getElementById('next').addEventListener('click',()=>{ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1); render(); });

  fStart.max = todayKey();
  entries = loadLocal();
  render();
  const splashStart = Date.now();
  const splash = document.getElementById('splash');
  function hideSplash(){
    const wait = Math.max(0, 400 - (Date.now() - splashStart));
    setTimeout(()=>{ splash.classList.add('hide'); setTimeout(()=>splash.remove(), 300); }, wait);
  }
  Promise.race([loadRemote(), new Promise(r=>setTimeout(r,6000))]).finally(hideSplash);
})();
</script>
</body>
</html>
